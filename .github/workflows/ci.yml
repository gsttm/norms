name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run check
      - run: bun test
      - run: bun run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:vscode
      - if: runner.os != 'Windows'
        run: bun run test:installer
