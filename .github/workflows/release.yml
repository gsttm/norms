name: Release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run check
      - run: bun test
      - run: bun run test:installer
      - name: Validate tag
        run: test "$GITHUB_REF_NAME" = "v$(bun -e 'import manifest from "./package.json"; process.stdout.write(manifest.version)')"
      - run: bun run package:release
      - run: ./dist/release/norms-linux-x64 --version
      - name: Attest release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
